<!DOCTYPE html>
<html>
<head>
    <title>User - View Products</title>

    <!-- CSS Link -->
    <link rel="stylesheet" href="useview.css">
</head>

<body>

<h1 class="title">Available Products</h1>

<div class="product-container">

    <div class="card">
        <img src="images/rice.jpg" alt="Rice">
        <h3>Rice</h3>
        <p class="price">₹50</p>
        <button>Add to Cart</button>
    </div>

    <div class="card">
        <img src="images/oil.jpg" alt="Oil">
        <h3>Cooking Oil</h3>
        <p class="price">₹120</p>
        <button>Add to Cart</button>
    </div>

    <div class="card">
        <img src="images/milk.jpg" alt="Milk">
        <h3>Milk</h3>
        <p class="price">₹30</p>
        <button>Add to Cart</button>
    </div>

    <div class="card">
        <img src="images/soap.jpg" alt="Soap">
        <h3>Soap</h3>
        <p class="price">₹25</p>
        <button>Add to Cart</button>
    </div>

</div>

</body>
</html>
