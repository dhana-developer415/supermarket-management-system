<!DOCTYPE html>
<html>
<head>
<title>User View Products</title>
<link rel="stylesheet" href="{{ url_for('static',filename='userview.css') }}">
</head>

<body>

<h1>Supermarket Products</h1>

<div class="container">

{% for p in products %}
<div class="product">

    <h2>{{ p['name'] }}</h2>
    <p>Category: {{ p['category'] }}</p>
    <p>Price: ₹{{ p['price'] }}</p>
    <p>Quantity: {{ p['quantity'] }}</p>
    <p>Minimum Stock: {{ p['minimum_stock'] }}</p>

    <!-- Add to Cart Button -->
   <a href="/add_to_cart/{{ p[0] }}">
     <button>Add to Cart</button>
   </a>
</div>
{% endfor %}

</div>

</body>
</html>
