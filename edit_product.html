<!DOCTYPE html>
<html>
<head>
    <title>Edit Product</title>

    <link rel="stylesheet" href="{{ url_for('static',filename='edit.css') }}">
</head>

<body>

<div class="container">

<h1>Edit Product</h1>

<form method="POST">

<label>Product Name:</label>
<input type="text" name="product_name" value="{{ product['name'] }}" required>

<label>Category:</label>
<input type="text" name="category" value="{{ product['category'] }}" required>

<label>Price:</label>
<input type="number" name="price" value="{{ product['price'] }}" required>

<label>Quantity:</label>
<input type="number" name="quantity" value="{{ product['quantity'] }}" required>

<label>Minimum Stock:</label>
<input type="number" name="minimum_stock" value="{{ product['minimum_stock'] }}" required>

<br><br>

<button type="submit" class="update-btn">Update Product</button>
<button type="reset" class="cancel-btn">Cancel</button>

</form>

</div>

</body>
</html>
